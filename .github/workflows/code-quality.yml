name: Laravel Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # 3️⃣ Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      # 4️⃣ Run PHP_CodeSniffer
      - name: Run PHPCS
        run: ./vendor/bin/phpcs app/

      # 5️⃣ Run PHP CS Fixer (optional, just checks if issues exist)
      - name: Run PHPCBF (auto-fix)
        run: ./vendor/bin/phpcbf app/

      # 6️⃣ Run PHPStan static analysis
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse app --level=max

      # 7️⃣ Cache Composer for faster builds (optional)
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
