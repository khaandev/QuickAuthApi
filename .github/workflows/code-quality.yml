name: Code Quality

on:
  push:
    branches:
      - main
      - fet/*  # any feature branches

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup PHP 8.4 and Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer
          coverage: none

      # Install dependencies
      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      # Run PHPCS
      - name: Check code style with PHPCS
        run: ./vendor/bin/phpcs app/

      # Auto-fix PHPCS violations (optional)
      - name: Fix code style with PHPCBF
        run: ./vendor/bin/phpcbf app/

      # # Run PHPStan
      # - name: Static analysis with PHPStan
      #   run: ./vendor/bin/phpstan analyse app --level max

      # Run tests
      # - name: Run tests
      #   run: php artisan test --verbose
